services:
  # ── Backend API ──
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://aerotwin:aerotwin_secret_2026@timescaledb:5432/aerotwin
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./maintenance_docs:/app/maintenance_docs
      - chroma_data:/app/chroma_data
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── TimescaleDB ──
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=aerotwin
      - POSTGRES_PASSWORD=aerotwin_secret_2026
      - POSTGRES_DB=aerotwin
    volumes:
      - tsdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerotwin"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Frontend ──
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - api

volumes:
  tsdb_data:
  chroma_data:
